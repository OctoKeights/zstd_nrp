# Checks every push and pull request, with the Rust of rust-toolchain.toml: the formatting (the
# Rust style guide's, by rustfmt), clippy, the documentation and the tests, the golden tests
# against zstd among them. The comparison with zstd itself
# (compare/compare.sh) needs its source and is not run here.
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The version in rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Tests
        run: cargo test --release
